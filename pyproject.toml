[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-poster"
version = "0.1.0"
description = "Write once. Publish to multiple social platforms. Runs locally."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "keyring>=25",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "regex>=2024.4",  # grapheme counting (Bluesky limits are in graphemes)
    "pystray>=0.19",  # system tray icon (LGPL-3.0, used as an unmodified library)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

build = [
    "pyinstaller>=6.10",
]

[project.scripts]
auto-poster = "auto_poster.main:run"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["auto_poster*"]

[tool.setuptools.package-data]
auto_poster = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
